<!DOCTYPE html>
<html>
  <head>
    <title>Performance Monitor</title>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: #f3f7ff;
        color: #0f172a;
        font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
          sans-serif;
      }

      .perf-dashboard {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 16px;
      }

      .perf-dashboard__header {
        margin-bottom: 12px;
      }

      .perf-dashboard__title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .perf-dashboard__subtitle {
        margin: 4px 0 0 0;
        font-size: 12px;
        color: #475569;
      }

      .perf-dashboard__error {
        margin-top: 10px;
        border-radius: 10px;
        border: 1px solid #ef4444;
        background: #fef2f2;
        color: #b91c1c;
        padding: 10px 12px;
        font-size: 12px;
      }

      .perf-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }

      .perf-card {
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        padding: 12px;
      }

      .perf-card__heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }

      .perf-card__label {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #334155;
      }

      .perf-card__value {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: #020617;
      }

      .perf-card__chart {
        width: 100%;
        height: 88px;
        border-radius: 8px;
        background: linear-gradient(180deg, #f8fbff, #f1f5f9);
        border: 1px solid #e2e8f0;
      }

      .perf-card__range {
        margin-top: 6px;
        font-size: 11px;
        color: #64748b;
      }

      .perf-card__empty {
        text-anchor: middle;
        dominant-baseline: middle;
        font-size: 11px;
        fill: #94a3b8;
      }
    </style>
  </head>

  <body>
    <section id="panel" class="perf-dashboard">
      <header class="perf-dashboard__header">
        <h1 class="perf-dashboard__title">Performance Metrics</h1>
        <p id="statusText" class="perf-dashboard__subtitle">
          Sampling every 0.1s, waiting for first sample...
        </p>
        <p id="errorText" class="perf-dashboard__error" hidden></p>
      </header>
      <div id="metricsGrid" class="perf-grid">
        <article class="perf-card">Initializing metrics...</article>
      </div>
    </section>
  </body>
</html>
